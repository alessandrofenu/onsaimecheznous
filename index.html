<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On s'aime chez nous</title>
  <meta name="description" content="onsaimechezno.us — test page">
  <style>
    :root{
      --bg:#0f1220; --card:#191d2e; --fg:#e8eaf2; --muted:#9aa3bd;
      --accent:#f472b6; --accent2:#6ee7b7;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#fdf2f8; --card:#ffffff; --fg:#1f2233; --muted:#6b7280; }
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      padding:24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--bg); color:var(--fg);
    }
    .card{
      background:var(--card); width:100%; max-width:440px; text-align:center;
      padding:2.6rem 2rem; border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }
    .heart{ font-size:3rem; line-height:1; }
    h1{ margin:.6rem 0 .2rem; font-size:1.6rem; }
    .domain{
      display:inline-block; margin:.4rem 0 1rem; font-weight:600;
      color:var(--accent);
    }
    p{ margin:.4rem 0; color:var(--muted); }
    .ok{
      margin-top:1.4rem; padding:.6rem 1rem; border-radius:999px;
      background:rgba(110,231,183,.15); color:var(--accent2);
      font-weight:600; font-size:.95rem; display:inline-block;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💕</div>
    <h1>On s'aime chez nous</h1>
    <span class="domain">onsaimechezno.us</span>
    <p>Bienvenue — ce site fonctionne&nbsp;!</p>
    <p>Hébergé sur GitHub Pages.</p>
    <span class="ok">✅ En ligne</span>
  </main>
</body>
</html>
